schema_version: "1.1"
name: literal-rendering-unlisted
description: English idioms the style does not list are not rendered word for word
execution:
  max_turns: 30
  timeout_seconds: 600
  prompt: |
    아래 글 초안을 팀 채널에 올릴 수 있게 다듬어 `result.md` 파일로 저장해 주세요.

    > 하루의 끝에, 새 파서가 맞는 선택입니다. 지연 시간의 바늘을 움직이지는 못하겠지만
    > 레이더에 두고 지켜보겠습니다.
graders:
  - name: no-end-of-the-day
    type: regex
    pattern: 하루의 끝
    match: not_contains
    target:
      source: file
      path: result.md
  - name: no-move-the-needle
    type: regex
    pattern: 바늘
    match: not_contains
    target:
      source: file
      path: result.md
  - name: no-on-our-radar
    type: regex
    pattern: 레이더
    match: not_contains
    target:
      source: file
      path: result.md
