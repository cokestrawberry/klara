schema_version: "1.1"
name: transliteration-unlisted
description: Transliterations the style does not list are replaced too
execution:
  max_turns: 30
  timeout_seconds: 600
  prompt: |
    아래 공지 초안을 팀 채널에 올릴 수 있게 다듬어 `result.md` 파일로 저장해 주세요.

    > 플래키 테스트 때문에 리트라이 설정 추가함. 머지 후 디플로이 예정.
graders:
  - name: no-flaky
    type: regex
    pattern: 플래키
    match: not_contains
    target:
      source: file
      path: result.md
  - name: no-retry
    type: regex
    pattern: 리트라이
    match: not_contains
    target:
      source: file
      path: result.md
  # 머지않아 ("soon") is a Korean word, not the transliteration of merge.
  - name: no-merge
    type: regex
    pattern: 머지(?!않)
    match: not_contains
    target:
      source: file
      path: result.md
  - name: no-deploy
    type: regex
    pattern: 디플로이
    match: not_contains
    target:
      source: file
      path: result.md
