schema_version: "1.1"
name: term-of-art
description: A routine deployment is not called a cutover
execution:
  max_turns: 30
  timeout_seconds: 600
  prompt: |
    아래 공지 초안을 팀 채널에 올릴 수 있게 다듬어 `result.md` 파일로 저장해 주세요.

    > 오늘 오후 3시 정기 배포 cutover 진행 예정. 배포 중 응답 지연 가능.
graders:
  - name: no-cutover
    type: regex
    pattern: cutover|컷오버
    flags: i
    match: not_contains
    target:
      source: file
      path: result.md
